<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a12">
<style>body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}</style>
<title>Le Grand Quiz de Hawkins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Nunito:wght@600;800;900&display=swap">
<style>
  :root {
    color-scheme: dark;
    --forest: #0b0a12;
    --forest-2: #1c1620;
    --moss: #7a1f1f;
    --parch: #f3ead2;
    --parch-2: #e6d8b3;
    --rim: #b3261e;
    --ink: #2b2417;
    --ink-soft: #6b5d44;
    --sheikah: #7ad0ff;
    --gold: #ff4a3d;
    --good: #4f9e3f;
    --bad: #c8553d;
    --leaf: #9ccc4f;
    --display: "Libre Baskerville", Georgia, serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
    --fs-q: clamp(18px, 2.1vmin + 1.1vw, 40px);
    --fs-a: clamp(15px, 1.5vmin + 0.8vw, 28px);
    --fs-s: clamp(13px, 1.1vmin + 0.6vw, 21px);
  }
  html, body { height: 100%; }
  body {
    background: var(--forest);
    color: var(--parch);
    font-family: var(--body);
    font-size: var(--fs-s);
    line-height: 1.4;
    overflow: hidden;
  }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .app {
    position: relative; z-index: 1;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr;
    padding-inline: max(16px, env(safe-area-inset-left, 0px));
    box-sizing: border-box;
  }

  /* ---------- top bar ---------- */
  .bar { display: flex; align-items: center; gap: 10px; padding-block: 8px 4px; min-width: 0; }
  .brand { font-family: var(--display); font-weight: 800; color: var(--gold); font-size: clamp(15px, 1.2vmin + 1vw, 26px); text-shadow: 0 2px 6px #000a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .hud { flex: 1; display: grid; gap: 4px; min-width: 0; }
  .hud-top { display: flex; justify-content: space-between; gap: 8px; font-weight: 900; text-shadow: 0 1px 4px #000c; }
  .hud-top .lv { font-family: var(--display); color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud-top .sc { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .seeds { display: grid; grid-template-columns: repeat(25, 1fr); gap: 3px; }
  .seed { height: clamp(6px, 1.1vmin, 12px); border-radius: 6px 6px 6px 1px; background: #ffffff30; transition: background .3s; }
  .seed.now { background: var(--sheikah); box-shadow: 0 0 8px var(--sheikah); }
  .seed.ok { background: var(--leaf); }
  .seed.ko { background: var(--bad); }
  .tools { display: flex; gap: 6px; flex: none; }
  .tool {
    width: clamp(38px, 5vmin, 54px); height: clamp(38px, 5vmin, 54px); border-radius: 50%;
    border: 0; background: #0c070bcc; color: var(--gold); font-size: clamp(17px, 2.4vmin, 26px);
    box-shadow: inset 0 0 0 2px var(--gold); display: grid; place-items: center; padding: 0; cursor: pointer;
  }
  .tool.off { color: #8a8a7a; box-shadow: inset 0 0 0 2px #8a8a7a; filter: grayscale(1); opacity: .6; position: relative; }
  .tool.off::after { content: ""; position: absolute; left: 22%; right: 22%; top: 50%; height: 3px; background: #c8553d; transform: rotate(-45deg); border-radius: 2px; }
  .tool:focus-visible { outline: 3px solid var(--sheikah); outline-offset: 2px; }

  /* ---------- stage & parchment ---------- */
  .stage { min-height: 0; overflow-y: auto; display: grid; place-items: center; padding-block: 6px max(12px, env(safe-area-inset-bottom, 0px)); }
  .card {
    width: min(100%, 1060px);
    box-sizing: border-box;
    background: linear-gradient(180deg, #f6eed8f2 0%, #e8dbb8f2 100%);
    color: var(--ink);
    border-radius: 16px;
    padding: clamp(14px, 2.4vmin, 30px);
    box-shadow: 0 14px 40px #000000aa, inset 0 0 0 2px var(--rim), inset 0 0 0 5px #f6eed8, inset 0 0 0 6px var(--rim);
    display: grid;
    gap: clamp(10px, 1.8vmin, 20px);
  }
  .card h2 { font-family: var(--display); font-size: clamp(20px, 2vmin + 1.2vw, 42px); margin: 0; line-height: 1.15; text-wrap: balance; }
  .card p { margin: 0; }

  button { font: inherit; cursor: pointer; }
  .btn {
    font-family: var(--display); font-weight: 800; font-size: clamp(17px, 1.6vmin + 0.9vw, 30px); letter-spacing: .04em;
    padding: .7em 1.2em; border: 0; border-radius: 12px;
    background: var(--forest-2); color: var(--gold);
    box-shadow: 0 4px 0 #070305, inset 0 0 0 2px var(--gold);
    transition: transform .08s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #070305, inset 0 0 0 2px var(--gold); }
  .btn.expert { background: #3a1414; color: #ffd9a0; box-shadow: 0 4px 0 #1a0606, inset 0 0 0 2px #e0603c; }
  .btn:focus-visible { outline: 3px solid var(--sheikah); outline-offset: 3px; }

  /* ---------- start ---------- */
  .start { grid-template-columns: 1fr; }
  .start .hero { display: grid; gap: 10px; align-content: center; }
  .start .title { font-family: var(--display); font-weight: 800; color: var(--forest-2); font-size: clamp(26px, 3.2vmin + 2vw, 64px); line-height: 1.05; text-wrap: balance; }
  .start .side { display: grid; gap: 12px; align-content: center; }
  .levels { display: grid; gap: 8px; }
  .lvl { display: flex; gap: 12px; align-items: center; }
  .lvl .badge { flex: none; width: clamp(36px, 5vmin, 56px); height: clamp(36px, 5vmin, 56px); border-radius: 50%; display: grid; place-items: center; font-size: clamp(18px, 2.6vmin, 30px); background: var(--forest-2); box-shadow: inset 0 0 0 2px var(--gold); }
  .lvl b { display: block; font-family: var(--display); }
  .lvl span { color: var(--ink-soft); }
  label.name { display: grid; gap: 4px; font-weight: 900; }
  input#player { font: inherit; font-weight: 800; padding: 10px 14px; border-radius: 10px; border: 2px solid var(--rim); background: #fffaf0; color: var(--ink); }
  input#player:focus { outline: 3px solid var(--sheikah); outline-offset: 1px; }
  .hint { color: var(--ink-soft); font-size: .88em; }

  /* ---------- question ---------- */
  .qcard { grid-template-areas: "head" "ans" "fb"; }
  .qhead { grid-area: head; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
  .qnum { font-family: var(--display); font-size: .85em; letter-spacing: .18em; color: var(--ink-soft); text-transform: uppercase; }
  .qtext { font-size: var(--fs-q); font-weight: 900; line-height: 1.25; text-wrap: balance; }
  .medal {
    width: clamp(58px, 13vmin, 150px); aspect-ratio: 1; max-width: 100%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3a1c24, #0c070b 70%);
    box-shadow: 0 6px 16px #0006, inset 0 0 0 3px var(--gold), inset 0 0 0 7px #0c070b, inset 0 0 0 8px #ff4a3d88;
    color: var(--gold); display: grid; place-items: center;
    animation: bob 3.2s ease-in-out infinite;
  }
  .medal svg { width: 62%; height: 62%; overflow: visible; }
  @keyframes bob { 50% { transform: translateY(-5px) rotate(-3deg); } }
  .answers { grid-area: ans; display: grid; gap: clamp(7px, 1.2vmin, 14px); }
  .ans {
    display: flex; align-items: center; gap: 12px; text-align: left;
    padding: clamp(9px, 1.5vmin, 18px) 14px; border-radius: 12px; border: 2px solid var(--rim);
    background: #fffaf0; color: var(--ink); font-weight: 800; font-size: var(--fs-a); line-height: 1.2;
    transition: background .15s, border-color .15s, transform .12s;
  }
  .ans .l { flex: none; width: 1.7em; height: 1.7em; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; background: var(--forest-2); color: var(--gold); font-size: .85em; }
  .ans:hover:not(:disabled) { border-color: var(--moss); transform: translateY(-2px); }
  .ans:focus-visible { outline: 3px solid var(--sheikah); outline-offset: 2px; }
  .ans:disabled { cursor: default; }
  .ans.right { background: #dcefcb; border-color: var(--good); animation: glowok .9s ease-out; }
  .ans.right .l { background: var(--good); color: #fff; }
  .ans.wrong { background: #f6d6cb; border-color: var(--bad); animation: shake .4s; }
  .ans.wrong .l { background: var(--bad); color: #fff; }
  .ans.dim { opacity: .5; }
  @keyframes glowok { 0% { box-shadow: 0 0 0 0 #9ccc4fcc; } 100% { box-shadow: 0 0 0 16px #9ccc4f00; } }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  .fb { grid-area: fb; }
  .fb:empty { display: none; }
  .feedback { border-radius: 12px; padding: clamp(10px, 1.6vmin, 18px); display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; background: #fffaf0; border: 2px dashed var(--rim); }
  .feedback .buddy { grid-row: span 2; width: clamp(52px, 10vmin, 110px); }
  .feedback .say { font-family: var(--display); font-weight: 800; font-size: var(--fs-a); }
  .feedback.ok .say { color: #3d7a2a; }
  .feedback.ko .say { color: var(--bad); }
  .feedback .fact { color: var(--ink); }
  .feedback .fact b { color: var(--moss); }
  .feedback .btn { grid-column: 1 / -1; justify-self: stretch; }
  .buddy.hop { animation: hop .7s ease-out 2; transform-origin: 50% 100%; }
  .buddy.sad { animation: droop 1.2s ease-in-out; transform-origin: 50% 100%; }
  @keyframes hop { 30% { transform: translateY(-18px) rotate(-8deg); } 60% { transform: translateY(0) scale(1.08, .92); } }
  @keyframes droop { 40% { transform: rotate(8deg) translateY(4px); } }

  /* ---------- interlude & results ---------- */
  .center { text-align: center; justify-items: center; }
  .center .medal { width: clamp(90px, 22vmin, 220px); }
  .kicker { font-family: var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); font-size: .9em; }
  .rank { font-family: var(--display); font-weight: 800; font-size: clamp(22px, 2.4vmin + 1.4vw, 48px); color: var(--forest-2); text-wrap: balance; line-height: 1.1; }
  .score { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 5vmin + 2vw, 96px); color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }
  .score small { font-size: .45em; color: var(--ink-soft); }
  .breakdown { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; width: 100%; }
  .breakdown div { background: #fffaf0; border: 2px solid var(--rim); border-radius: 10px; padding: 6px 4px; display: grid; gap: 1px; text-align: center; }
  .breakdown .e { font-size: 1.4em; }
  .breakdown .n { font-weight: 900; font-variant-numeric: tabular-nums; font-size: 1.15em; }
  .breakdown .t { font-size: .78em; color: var(--ink-soft); font-weight: 800; }
  .missed { text-align: left; width: 100%; display: grid; gap: 6px; }
  .missed h3 { font-family: var(--display); font-size: 1em; margin: 0; }
  .missed ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; max-height: 34vh; overflow-y: auto; }
  .missed li { background: #fffaf0; border-radius: 10px; padding: 8px 12px; border-left: 4px solid var(--bad); }
  .missed li b { color: #3d7a2a; }
  .res-main, .res-side { display: grid; gap: 10px; justify-items: center; align-content: center; }

  /* ---------- landscape (phone turned sideways, TV, desktop) ---------- */
  @media (min-aspect-ratio: 5/4) {
    .start { grid-template-columns: 1.1fr 1fr; gap: clamp(16px, 3vw, 44px); }
    .qcard { grid-template-columns: 1fr 1.05fr; grid-template-areas: "head ans" "fb ans"; align-items: center; column-gap: clamp(16px, 3vw, 40px); }
    .qhead { grid-template-columns: 1fr; justify-items: start; }
    .qcard.answered .qhead .medal { display: none; }
    .qcard.answered { grid-template-areas: "head ans" "fb ans"; }
    .result { grid-template-columns: 1fr 1.2fr; text-align: left; }
    .res-main { justify-items: center; text-align: center; }
    .missed ul { max-height: 40vh; }
  }
  @media (min-aspect-ratio: 5/4) and (max-height: 480px) {
    .qhead .medal { width: 54px; }
    .missed ul { max-height: 30vh; }
  }

  .pop { animation: pop .35s cubic-bezier(.2, 1.4, .5, 1); }
  @keyframes pop { from { transform: scale(.94) translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .pop, .medal, .buddy.hop, .buddy.sad, .ans.right, .ans.wrong { animation: none; }
    .ans, .btn, .seed { transition: none; }
  }
</style>
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>
<div class="app">
  <header class="bar" id="bar"></header>
  <main class="stage" id="stage"></main>
</div>

<script>
/* ================= DATA ================= */
const EXPERT_N = 25;
const LEVELS = [
  { name: "Bienvenue à Hawkins", emoji: "🚲", desc: "Pour s'échauffer", scene: "hawkins", song: "A", icon: "bike", quick: 5 },
  { name: "La bande de Hawkins", emoji: "📻", desc: "Les personnages et leurs aventures", scene: "mall", song: "B", icon: "walkie", quick: 6 },

];

const Q = [
  /* ---- épreuve 1 : Bienvenue à Hawkins ---- */
  { lv:0, sc:"lab", ic:"sprite", q:"Comment s'appelle la fille aux super-pouvoirs ?", o:["Max","Onze","Robin","Erica"], a:1,

  { lv:0, sc:"hawkins", ic:"sprite", q:"Quel est le plat préféré d'Onze ?", o:["Les crêpes","Les gaufres","La pizza","Les frites"], a:1,

  { lv:0, sc:"hawkins", ic:"map", q:"Comment s'appelle la ville où se passe la série ?", o:["Hawkins","Springfield","Riverdale","Derry"], a:0,

  { lv:0, sc:"woods", ic:"bike", q:"Qui disparaît au tout début de la saison 1 ?", o:["Mike","Dustin","Will","Lucas"], a:2,

  { lv:0, sc:"lights", ic:"lights", q:"Comment Joyce parle-t-elle avec Will quand il a disparu ?", o:["Avec un téléphone","Avec des guirlandes lumineuses","Avec des lettres","Avec la télévision"], a:1,

  { lv:0, sc:"upside", ic:"gate", q:"Comment s'appelle le monde parallèle, sombre et froid ?", o:["Le Monde caché","Le Monde à l'envers","L'Autre Côté","Le Monde des ombres"], a:1,

  { lv:0, sc:"hawkins", ic:"dice", q:"À quel jeu jouent les garçons au tout début de la série ?", o:["Au Monopoly","Aux échecs","À Donjons et Dragons","Aux cartes"], a:2,

  { lv:0, sc:"hawkins", ic:"bike", q:"Comment les enfants se déplacent-ils dans Hawkins ?", o:["En skate","À vélo","En bus","En voiture"], a:1,

  { lv:1, sc:"hawkins", ic:"guitar", q:"Qui est le chef du Hellfire Club ?", o:["Mike","Eddie","Steve","Jason"], a:1,
    f:"Le club de Donjons et Dragons du lycée de Hawkins." },
  { lv:1, sc:"upside", ic:"guitar", q:"De quel instrument joue Eddie ?", o:["De la batterie","De la guitare électrique","Du piano","De la trompette"], a:1,
    f:"Il joue même en plein Monde à l'envers !" },
  { lv:1, sc:"hawkins", ic:"star", q:"Comment s'appelle la meilleure amie de Nancy, qui disparaît dans la saison 1 ?", o:["Robin","Barb","Chrissy","Heather"], a:1,

  return `<div class="tools">
    <button class="tool${Sound.musicOn ? "" : " off"}" id="snd" aria-label="Musique" title="Musique">🎵</button>
    <button class="tool${Sound.fxOn ? "" : " off"}" id="sfx" aria-label="Bruitages" title="Bruitages">🔔</button>
    ${canFS ? `<button class="tool" id="fs" aria-label="Plein écran">⛶</button>` : ""}
  </div>`;
}
function wireTools() {
  const s = document.getElementById("snd");
  s.onclick = () => { Sound.init(); s.classList.toggle("off", !Sound.toggleMusic()); };
  const x = document.getElementById("sfx");
  x.onclick = () => { Sound.init(); x.classList.toggle("off", !Sound.toggleFx()); Sound.fx("tap"); };
  const f = document.getElementById("fs");
  if (f) f.onclick = () => {
    const d = document, el = d.documentElement;
    try {
      if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      else { const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (p && p.catch) p.catch(() => {}); }
    } catch (e) {}
  };
}
function setBar(inner) { bar.innerHTML = inner + tools(); wireTools(); }
function hud() {
  const q = st.qs[st.i];
  const seeds = st.qs.map((_, k) => { const r = st.results[k]; return `<div class="seed ${r === true ? "ok" : r === false ? "ko" : k === st.i ? "now" : ""}"></div>`; }).join("");
  return `<div class="hud"><div class="hud-top"><span class="lv">${LEVELS[q.lv].emoji} ${LEVELS[q.lv].name}</span><span class="sc">🧇 ${st.score}</span></div>
    <div class="seeds" style="grid-template-columns: repeat(${st.qs.length}, 1fr)" aria-label="Question ${st.i + 1} sur ${st.qs.length}">${seeds}</div></div>`;
}
function keepAwake() {
  try { if (navigator.wakeLock && !wake) navigator.wakeLock.request("screen").then(l => { wake = l; l.addEventListener("release", () => wake = null); }).catch(() => {}); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && st) keepAwake(); });

function start() {
  setScene("hawkins"); Sound.play("A");
  setBar(`<div class="brand">Stranger Things</div>`);
  const name = store("hawkins-name") || "";
  const MAIN = LEVELS.filter(l => !l.expert), nMain = Q.filter(q => !LEVELS[q.lv].expert).length;
  const quickN = MAIN.reduce((s, l) => s + l.quick, 0);
  const bq = store("hawkins-best-quick"), bg = store("hawkins-best-grand"), bx = store("hawkins-best-expert");
  const recs = [bq && `partie rapide <b>${esc(bq)}/${quickN}</b>`, bg && `grande aventure <b>${esc(bg)}/${nMain}</b>`, bx && `mode Expert <b>${esc(bx)}/${EXPERT_N}</b>`].filter(Boolean);
  stage.innerHTML = `
    <section class="card start pop">
      <div class="hero">
        <div class="kicker">Stranger Things · Saisons 1 à 4</div>
        <div class="title">Le Grand Quiz de Hawkins</div>
        <p>${nMain} questions en quatre épreuves de plus en plus difficiles. Chaque bonne réponse te rapporte une gaufre&nbsp;!</p>
        ${recs.length ? `<p class="hint">🏆 Records : ${recs.join(" · ")}</p>` : ""}
        <div class="levels">${MAIN.map(l => `<div class="lvl"><div class="badge">${l.emoji}</div><div><b>${l.name}</b><span>${l.desc}</span></div></div>`).join("")}</div>
      </div>
      <div class="side">
        <label class="name" for="player">Ton prénom
          <input id="player" type="text" maxlength="20" autocomplete="off" value="${esc(name)}" placeholder="Ton prénom">
        </label>
        <button class="btn" id="quick">Partie rapide · ${quickN} questions</button>
        <button class="btn" id="grand">Grande aventure · ${nMain} questions</button>
        <button class="btn expert" id="expert">💀 Mode Expert · ${EXPERT_N} questions</button>
        <p class="hint">Les questions de la partie rapide sont tirées au hasard : chaque partie est différente !</p>
        <p class="hint">🎵 coupe la musique du quiz, 🔔 coupe les bruitages.</p>
        <p class="hint">📺 Pour la télé : tourne le téléphone en mode paysage avant de lancer la diffusion.</p>
      </div>
    </section>`;
  const begin = mode => {
    Sound.init(); Sound.fx("tap"); keepAwake();
    const n = document.getElementById("player").value.trim() || "la bande";
    store("hawkins-name", document.getElementById("player").value.trim());
    let seen = [];
    try { seen = JSON.parse(store("hawkins-seen") || "[]"); } catch (e) { seen = []; }
    if (!Array.isArray(seen)) seen = [];
    const picked = [];
    const xLv = LEVELS.findIndex(l => l.expert);
    if (mode === "expert") {
      let xs = [];
      try { xs = JSON.parse(store("hawkins-seen-x") || "[]"); } catch (e) { xs = []; }
      if (!Array.isArray(xs)) xs = [];
      const all = shuffle(Q.map((_, k) => k).filter(k => Q[k].lv === xLv));
      let fresh = all.filter(k => !xs.includes(k));
      if (fresh.length < EXPERT_N) { xs = []; fresh = fresh.concat(all.filter(k => !fresh.includes(k))); }
      const take = fresh.slice(0, EXPERT_N);
      xs.push(...take); store("hawkins-seen-x", JSON.stringify(xs));
      picked.push(...take);
    } else LEVELS.forEach((l, lv) => {
      if (l.expert) return;
      const qs = shuffle(Q.map((_, k) => k).filter(k => Q[k].lv === lv));
      if (mode !== "quick") { picked.push(...qs); return; }
      let fresh = qs.filter(k => !seen.includes(k));
      if (fresh.length < l.quick) {
        seen = seen.filter(k => !Q[k] || Q[k].lv !== lv);
        fresh = fresh.concat(qs.filter(k => !fresh.includes(k)));
      }
      const take = fresh.slice(0, l.quick);
      seen.push(...take); picked.push(...take);
    });
    if (mode === "quick") store("hawkins-seen", JSON.stringify(seen));
    const pool = picked.map(k => mode === "expert" ? { ...Q[k], lv: xLv } : Q[k]);
    st = { name: n, mode, i: 0, score: 0, results: [],
      qs: pool.map(q => { const order = shuffle(q.o.map((_, k) => k)); return { ...q, opts: order.map(k => q.o[k]), right: order.indexOf(q.a) }; }) };
    interlude(st.qs[0].lv);
  };
  document.getElementById("quick").onclick = () => begin("quick");
  document.getElementById("grand").onclick = () => begin("grand");
  document.getElementById("expert").onclick = () => begin("expert");
}

function interlude(lv) {
  const l = LEVELS[lv];
  setScene(l.scene); Sound.play(l.song); Sound.fx("level");
  const n = st.qs.filter(q => q.lv === lv).length;
  setBar(`<div class="brand">${l.expert ? l.name : `Épreuve ${lv + 1} sur ${LEVELS.filter(x => !x.expert).length}`}</div>`);
  stage.innerHTML = `
    <section class="card center pop">
      ${medal(l.icon)}
      <div class="kicker">${st.i === 0 ? `C'est parti, ${esc(st.name)} !` : lv === 3 ? "Attention, ça devient très dur !" : "Épreuve réussie !"}</div>
      <h2>${l.expert ? l.name : `Épreuve ${lv + 1} : ${l.name}`}</h2>
      <p>${n} questions · ${l.desc}</p>
      <button class="btn" id="go">J'y vais !</button>
    </section>`;
  const g = document.getElementById("go"); g.onclick = () => { Sound.fx("tap"); ask(); }; g.focus({ preventScroll: true });
}

function ask() {
  const q = st.qs[st.i];
  setScene(q.sc);
  setBar(hud());
  stage.innerHTML = `
    <section class="card qcard pop" id="qc">
      <div class="qhead">
        ${medal(q.ic)}
        <div>
          <div class="qnum">Question ${st.i + 1} / ${st.qs.length}</div>
          <div class="qtext">${esc(q.q)}</div>
        </div>
      </div>
      <div class="answers">
        ${q.opts.map((o, k) => `<button class="ans" data-k="${k}"><span class="l">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}
      </div>
      <div class="fb" id="fb"></div>
    </section>`;
  stage.scrollTop = 0;
  stage.querySelectorAll(".ans").forEach(b => b.onclick = () => answer(+b.dataset.k));
}

function answer(k) {
  const q = st.qs[st.i], ok = k === q.right;
  st.results[st.i] = ok; if (ok) st.score++;
  Sound.fx(ok ? "good" : "bad");
  document.getElementById("qc").classList.add("answered");
  stage.querySelectorAll(".ans").forEach((b, j) => {
    b.disabled = true;
    if (j === q.right) b.classList.add("right"); else if (j === k) b.classList.add("wrong"); else b.classList.add("dim");
  });
  setBar(hud());
  const last = st.i === st.qs.length - 1, fb = document.getElementById("fb");
  fb.innerHTML = `<div class="feedback pop ${ok ? "ok" : "ko"}">
    ${BUDDY}
    <div class="say">${ok ? pick(CHEERS) : pick(OOPS) + " C'était : " + esc(q.opts[q.right])}</div>
    <div class="fact">💡 ${q.f}</div>
    <button class="btn" id="next">${last ? "Voir mon score" : "Question suivante"}</button>
  </div>`;
  fb.querySelector(".buddy").classList.add(ok ? "hop" : "sad");
  const next = document.getElementById("next");
  next.onclick = () => {
    Sound.fx("tap"); st.i++;
    if (st.i >= st.qs.length) return finish();
    if (st.qs[st.i].lv !== st.qs[st.i - 1].lv) return interlude(st.qs[st.i].lv);
    ask();
  };
  next.focus({ preventScroll: true });
  fb.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
}

function finish() {
  const N = st.qs.length, rank = RANKS.find(r => st.score / N >= r.min);
  const key = "hawkins-best-" + st.mode;
  const prevBest = parseInt(store(key) || "0", 10), record = st.score > prevBest;
  if (record) store(key, String(st.score));
  const per = LEVELS.map((l, lv) => { const idx = st.qs.map((q, k) => q.lv === lv ? k : -1).filter(k => k >= 0); return { l, got: idx.filter(k => st.results[k]).length, of: idx.length }; }).filter(p => p.of > 0);
  const missed = st.qs.filter((q, k) => !st.results[k]);
  setScene(st.score / N >= .68 ? "arcade" : "hawkins"); Sound.play("A"); Sound.fx("win"); burst();
  setBar(`<div class="brand">Fin de l'aventure</div>`);
  stage.innerHTML = `
    <section class="card result pop">
      <div class="res-main">
        ${medal(rank.icon)}
        <div class="kicker">${esc(st.name)}, tu es…</div>
        <div class="rank">${rank.name}</div>
        <div class="score">${st.score}<small> / ${N}</small></div>
        <p>${rank.msg}${record && prevBest > 0 ? " <b>Nouveau record !</b>" : ""}</p>
      </div>
      <div class="res-side">
        <div class="breakdown">${per.map(p => `<div><span class="e">${p.l.emoji}</span><span class="n">${p.got}/${p.of}</span><span class="t">${p.l.name}</span></div>`).join("")}</div>
        ${missed.length ? `<div class="missed"><h3>Les réponses à retenir</h3><ul>${missed.map(q => `<li>${esc(q.q)}<br>→ <b>${esc(q.o[q.a])}</b></li>`).join("")}</ul></div>` : `<p>Un sans-faute ! 🎉</p>`}
        <button class="btn" id="again">Rejouer</button>
      </div>
    </section>`;
  stage.scrollTop = 0;
  document.getElementById("again").onclick = () => { Sound.fx("tap"); start(); };
}

start();
</script>
</body>
</html>
