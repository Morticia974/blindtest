<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121821">
<style>body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}</style>
<title>Le Grand Quiz de Beurk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&family=Nunito:wght@600;800;900&display=swap">
<style>
  :root {
    color-scheme: dark;
    --forest: #121821;
    --forest-2: #1f2a36;
    --moss: #2b5d74;
    --parch: #f3ead2;
    --parch-2: #e6d8b3;
    --rim: #b8905a;
    --ink: #2b2417;
    --ink-soft: #6b5d44;
    --sheikah: #6fe38a;
    --gold: #f0a03c;
    --good: #4f9e3f;
    --bad: #c8553d;
    --leaf: #9ccc4f;
    --display: "Almendra", Georgia, serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
    --fs-q: clamp(18px, 2.1vmin + 1.1vw, 40px);
    --fs-a: clamp(15px, 1.5vmin + 0.8vw, 28px);
    --fs-s: clamp(13px, 1.1vmin + 0.6vw, 21px);
  }
  html, body { height: 100%; }
  body {
    background: var(--forest);
    color: var(--parch);
    font-family: var(--body);
    font-size: var(--fs-s);
    line-height: 1.4;
    overflow: hidden;
  }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .app {
    position: relative; z-index: 1;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr;
    padding-inline: max(16px, env(safe-area-inset-left, 0px));
    box-sizing: border-box;
  }

  /* ---------- top bar ---------- */
  .bar { display: flex; align-items: center; gap: 10px; padding-block: 8px 4px; min-width: 0; }
  .brand { font-family: var(--display); font-weight: 800; color: var(--gold); font-size: clamp(15px, 1.2vmin + 1vw, 26px); text-shadow: 0 2px 6px #000a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .hud { flex: 1; display: grid; gap: 4px; min-width: 0; }
  .hud-top { display: flex; justify-content: space-between; gap: 8px; font-weight: 900; text-shadow: 0 1px 4px #000c; }
  .hud-top .lv { font-family: var(--display); color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud-top .sc { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .seeds { display: grid; grid-template-columns: repeat(25, 1fr); gap: 3px; }
  .seed { height: clamp(6px, 1.1vmin, 12px); border-radius: 6px 6px 6px 1px; background: #ffffff30; transition: background .3s; }
  .seed.now { background: var(--sheikah); box-shadow: 0 0 8px var(--sheikah); }
  .seed.ok { background: var(--leaf); }
  .seed.ko { background: var(--bad); }
  .tools { display: flex; gap: 6px; flex: none; }
  .tool {
    width: clamp(38px, 5vmin, 54px); height: clamp(38px, 5vmin, 54px); border-radius: 50%;
    border: 0; background: #0e141bcc; color: var(--gold); font-size: clamp(17px, 2.4vmin, 26px);
    box-shadow: inset 0 0 0 2px var(--gold); display: grid; place-items: center; padding: 0; cursor: pointer;
  }
  .tool.off { color: #8a8a7a; box-shadow: inset 0 0 0 2px #8a8a7a; filter: grayscale(1); opacity: .6; position: relative; }
  .tool.off::after { content: ""; position: absolute; left: 22%; right: 22%; top: 50%; height: 3px; background: #c8553d; transform: rotate(-45deg); border-radius: 2px; }
  .tool:focus-visible { outline: 3px solid var(--sheikah); outline-offset: 2px; }

  /* ---------- stage & parchment ---------- */
  .stage { min-height: 0; overflow-y: auto; display: grid; place-items: center; padding-block: 6px max(12px, env(safe-area-inset-bottom, 0px)); }
  .card {
    width: min(100%, 1060px);
    box-sizing: border-box;
    background: linear-gradient(180deg, #f6eed8f2 0%, #e8dbb8f2 100%);
    color: var(--ink);
    border-radius: 16px;
    padding: clamp(14px, 2.4vmin, 30px);
    box-shadow: 0 14px 40px #000000aa, inset 0 0 0 2px var(--rim), inset 0 0 0 5px #f6eed8, inset 0 0 0 6px var(--rim);
    display: grid;
    gap: clamp(10px, 1.8vmin, 20px);
  }
  .card h2 { font-family: var(--display); font-size: clamp(20px, 2vmin + 1.2vw, 42px); margin: 0; line-height: 1.15; text-wrap: balance; }
  .card p { margin: 0; }

  button { font: inherit; cursor: pointer; }
  .btn {
    font-family: var(--display); font-weight: 800; font-size: clamp(17px, 1.6vmin + 0.9vw, 30px); letter-spacing: .04em;
    padding: .7em 1.2em; border: 0; border-radius: 12px;
    background: var(--forest-2); color: var(--gold);
    box-shadow: 0 4px 0 #06090d, inset 0 0 0 2px var(--gold);
    transition: transform .08s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #06090d, inset 0 0 0 2px var(--gold); }
  .btn:focus-visible { outline: 3px solid var(--sheikah); outline-offset: 3px; }

  /* ---------- start ---------- */
  .start { grid-template-columns: 1fr; }
  .start .hero { display: grid; gap: 10px; align-content: center; }
  .start .title { font-family: var(--display); font-weight: 800; color: var(--forest-2); font-size: clamp(26px, 3.2vmin + 2vw, 64px); line-height: 1.05; text-wrap: balance; }
  .start .side { display: grid; gap: 12px; align-content: center; }
  .levels { display: grid; gap: 8px; }
  .lvl { display: flex; gap: 12px; align-items: center; }
  .lvl .badge { flex: none; width: clamp(36px, 5vmin, 56px); height: clamp(36px, 5vmin, 56px); border-radius: 50%; display: grid; place-items: center; font-size: clamp(18px, 2.6vmin, 30px); background: var(--forest-2); box-shadow: inset 0 0 0 2px var(--gold); }
  .lvl b { display: block; font-family: var(--display); }
  .lvl span { color: var(--ink-soft); }
  label.name { display: grid; gap: 4px; font-weight: 900; }
  input#player { font: inherit; font-weight: 800; padding: 10px 14px; border-radius: 10px; border: 2px solid var(--rim); background: #fffaf0; color: var(--ink); }
  input#player:focus { outline: 3px solid var(--sheikah); outline-offset: 1px; }
  .hint { color: var(--ink-soft); font-size: .88em; }

  /* ---------- question ---------- */
  .qcard { grid-template-areas: "head" "ans" "fb"; }
  .qhead { grid-area: head; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
  .qnum { font-family: var(--display); font-size: .85em; letter-spacing: .18em; color: var(--ink-soft); text-transform: uppercase; }
  .qtext { font-size: var(--fs-q); font-weight: 900; line-height: 1.25; text-wrap: balance; }
  .medal {
    width: clamp(58px, 13vmin, 150px); aspect-ratio: 1; max-width: 100%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2d3b4b, #0e141b 70%);
    box-shadow: 0 6px 16px #0006, inset 0 0 0 3px var(--gold), inset 0 0 0 7px #0e141b, inset 0 0 0 8px #f0a03c88;
    color: var(--gold); display: grid; place-items: center;
    animation: bob 3.2s ease-in-out infinite;
  }
  .medal svg { width: 62%; height: 62%; overflow: visible; }
  @keyframes bob { 50% { transform: translateY(-5px) rotate(-3deg); } }
  .answers { grid-area: ans; display: grid; gap: clamp(7px, 1.2vmin, 14px); }
  .ans {
    display: flex; align-items: center; gap: 12px; text-align: left;
    padding: clamp(9px, 1.5vmin, 18px) 14px; border-radius: 12px; border: 2px solid var(--rim);
    background: #fffaf0; color: var(--ink); font-weight: 800; font-size: var(--fs-a); line-height: 1.2;
    transition: background .15s, border-color .15s, transform .12s;
  }
  .ans .l { flex: none; width: 1.7em; height: 1.7em; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; background: var(--forest-2); color: var(--gold); font-size: .85em; }
  .ans:hover:not(:disabled) { border-color: var(--moss); transform: translateY(-2px); }
  .ans:focus-visible { outline: 3px solid var(--sheikah); outline-offset: 2px; }
  .ans:disabled { cursor: default; }
  .ans.right { background: #dcefcb; border-color: var(--good); animation: glowok .9s ease-out; }
  .ans.right .l { background: var(--good); color: #fff; }
  .ans.wrong { background: #f6d6cb; border-color: var(--bad); animation: shake .4s; }
  .ans.wrong .l { background: var(--bad); color: #fff; }
  .ans.dim { opacity: .5; }
  @keyframes glowok { 0% { box-shadow: 0 0 0 0 #9ccc4fcc; } 100% { box-shadow: 0 0 0 16px #9ccc4f00; } }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  .fb { grid-area: fb; }
  .fb:empty { display: none; }
  .feedback { border-radius: 12px; padding: clamp(10px, 1.6vmin, 18px); display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; background: #fffaf0; border: 2px dashed var(--rim); }
  .feedback .buddy { grid-row: span 2; width: clamp(52px, 10vmin, 110px); }
  .feedback .say { font-family: var(--display); font-weight: 800; font-size: var(--fs-a); }
  .feedback.ok .say { color: #3d7a2a; }
  .feedback.ko .say { color: var(--bad); }
  .feedback .fact { color: var(--ink); }
  .feedback .fact b { color: var(--moss); }
  .feedback .btn { grid-column: 1 / -1; justify-self: stretch; }
  .buddy.hop { animation: hop .7s ease-out 2; transform-origin: 50% 100%; }
  .buddy.sad { animation: droop 1.2s ease-in-out; transform-origin: 50% 100%; }
  @keyframes hop { 30% { transform: translateY(-18px) rotate(-8deg); } 60% { transform: translateY(0) scale(1.08, .92); } }
  @keyframes droop { 40% { transform: rotate(8deg) translateY(4px); } }

  /* ---------- interlude & results ---------- */
  .center { text-align: center; justify-items: center; }
  .center .medal { width: clamp(90px, 22vmin, 220px); }
  .kicker { font-family: var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); font-size: .9em; }
  .rank { font-family: var(--display); font-weight: 800; font-size: clamp(22px, 2.4vmin + 1.4vw, 48px); color: var(--forest-2); text-wrap: balance; line-height: 1.1; }
  .score { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 5vmin + 2vw, 96px); color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }
  .score small { font-size: .45em; color: var(--ink-soft); }
  .breakdown { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; width: 100%; }
  .breakdown div { background: #fffaf0; border: 2px solid var(--rim); border-radius: 10px; padding: 6px 4px; display: grid; gap: 1px; text-align: center; }
  .breakdown .e { font-size: 1.4em; }
  .breakdown .n { font-weight: 900; font-variant-numeric: tabular-nums; font-size: 1.15em; }
  .breakdown .t { font-size: .78em; color: var(--ink-soft); font-weight: 800; }
  .missed { text-align: left; width: 100%; display: grid; gap: 6px; }
  .missed h3 { font-family: var(--display); font-size: 1em; margin: 0; }
  .missed ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; max-height: 34vh; overflow-y: auto; }
  .missed li { background: #fffaf0; border-radius: 10px; padding: 8px 12px; border-left: 4px solid var(--bad); }
  .missed li b { color: #3d7a2a; }
  .res-main, .res-side { display: grid; gap: 10px; justify-items: center; align-content: center; }

  /* ---------- landscape (phone turned sideways, TV, desktop) ---------- */
  @media (min-aspect-ratio: 5/4) {
    .start { grid-template-columns: 1.1fr 1fr; gap: clamp(16px, 3vw, 44px); }
    .qcard { grid-template-columns: 1fr 1.05fr; grid-template-areas: "head ans" "fb ans"; align-items: center; column-gap: clamp(16px, 3vw, 40px); }
    .qhead { grid-template-columns: 1fr; justify-items: start; }
    .qcard.answered .qhead .medal { display: none; }
    .qcard.answered { grid-template-areas: "head ans" "fb ans"; }
    .result { grid-template-columns: 1fr 1.2fr; text-align: left; }
    .res-main { justify-items: center; text-align: center; }
    .missed ul { max-height: 40vh; }
  }
  @media (min-aspect-ratio: 5/4) and (max-height: 480px) {
    .qhead .medal { width: 54px; }
    .missed ul { max-height: 30vh; }
  }

  .pop { animation: pop .35s cubic-bezier(.2, 1.4, .5, 1); }
  @keyframes pop { from { transform: scale(.94) translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .pop, .medal, .buddy.hop, .buddy.sad, .ans.right, .ans.wrong { animation: none; }
    .ans, .btn, .seed { transition: none; }
  }
</style>
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>
<div class="app">
  <header class="bar" id="bar"></header>
  <main class="stage" id="stage"></main>
</div>

<script>
/* ================= DATA ================= */
const LEVELS = [
  { name: "Premiers pas à Beurk", emoji: "🪓", desc: "Pour s'échauffer à Beurk", scene: "berk", song: "A", icon: "helmet", quick: 6 },
  { name: "L'école des dragons", emoji: "🐉", desc: "Les dragons et leurs dragonniers", scene: "sky", song: "B", icon: "wing", quick: 7 },
  { name: "Envol dans le ciel", emoji: "🌙", desc: "Les secrets des trois films", scene: "night", song: "C", icon: "eye", quick: 7 },
  { name: "Le défi du Furie Nocturne", emoji: "🔥", desc: "Les petits détails des films, pour les pros", scene: "hidden", song: "D", icon: "flame", quick: 5 }
];

const Q = [
  /* ---- épreuve 1 : Premiers pas à Beurk ---- */
  { lv:0, sc:"cove", ic:"sprite", q:"Comment s'appelle le dragon de Harold ?", o:["Tempête","Krokmou","Krochefer","Bouledogre"], a:1,
    f:"Harold l'appelle Krokmou parce que ses dents rentrent et sortent : il a des <b>dents rétractables</b> !" },
  { lv:0, sc:"night", ic:"eye", q:"De quelle espèce est Krokmou ?", o:["Un Cauchemar Monstrueux","Un Furie Nocturne","Un Gronk","Un Terreur Terrible"], a:1,
    f:"Le Furie Nocturne est le dragon le plus rare : personne n'en avait jamais vu avant Harold !" },
  { lv:0, sc:"berk", ic:"map", q:"Comment s'appelle l'île où vivent Harold et les Vikings ?", o:["Beurk","Asgard","Glaçonia","Vikingland"], a:0,
    f:"Harold dit que Beurk se trouve « à douze jours au nord du Désespoir »… et qu'au lieu des souris, là-bas, il y a des dragons !" },
  { lv:0, sc:"night", ic:"sprite", q:"De quelle couleur est Krokmou ?", o:["Bleu","Rouge","Noir","Vert"], a:2,
    f:"Tout noir… avec de grands yeux verts ! C'est parfait pour se cacher dans le ciel la nuit." },
  { lv:0, sc:"sky", ic:"spikes", q:"Comment s'appelle le dragon d'Astrid ?", o:["Tempête","Bouledogre","Krochefer","Prout et Pète"], a:0,
    f:"Astrid l'appelle « ma belle ». Tempête est une dragonne très rapide." },
  { lv:0, sc:"berk", ic:"helmet", q:"Qui est le papa de Harold, le chef du village ?", o:["Gueulfor","Stoïk la Brute","Drago Poing-Sanglant","Rustik"], a:1,
    f:"Stoïk la Brute est immense : il mesure plus de deux mètres !" },
  { lv:0, sc:"cove", ic:"tail", q:"Que fabrique Harold pour que Krokmou puisse revoler ?", o:["Une nouvelle aile","Un morceau de queue","Des bottes volantes","Un casque magique"], a:1,
    f:"Krokmou avait perdu un morceau de sa queue. Harold lui en fabrique un, qu'il dirige avec ses pieds, assis sur une selle." },
  { lv:0, sc:"berk", ic:"hammer", q:"Quel est le métier de Gueulfor ?", o:["Pêcheur","Forgeron","Boulanger","Chef du village"], a:1,
    f:"Harold est son apprenti à la forge. Gueulfor change d'outil au bout de son bras !" },
  { lv:0, sc:"berk", ic:"rock", q:"Comment s'appelle le dragon de Varek ?", o:["Krochefer","Tempête","Bouledogre","Krokmou"], a:2,
    f:"Varek l'appelle aussi « Chouchoute » !" },
  { lv:0, sc:"cove", ic:"fish", q:"Que donne Harold à Krokmou pour gagner sa confiance la première fois ?", o:["Une pomme","Un poisson","Un mouton","Un gâteau"], a:1,
    f:"Krokmou en recrache un morceau pour le partager… et Harold doit le manger, tout baveux ! Beurk !" },
  { lv:0, sc:"berk", ic:"heads", q:"Comment s'appellent les jumeaux blagueurs ?", o:["Rustik et Varek","Kranedur et Kognedur","Prout et Pète","Stoïk et Gueulfor"], a:1,
    f:"Kranedur est le garçon et Kognedur la fille. Ils se disputent tout le temps !" },
  { lv:0, sc:"sky", ic:"heads", q:"Le dragon des jumeaux a deux têtes. Comment s'appelle-t-il ?", o:["Prout et Pète","Krochefer","Tempête","Double-Croc"], a:0,
    f:"Une tête crache du gaz, l'autre fait une étincelle pour l'allumer. Chaque jumeau dirige une tête !" },

  /* ---- épreuve 2 : L'école des dragons ---- */
  { lv:1, sc:"night", ic:"heart", q:"Comment s'appelle la dragonne blanche dont Krokmou tombe amoureux ?", o:["La Mort Rouge","Tempête","La Furie Éclair","La Furie Blanche"], a:2,
    f:"Elle apparaît dans Dragons 3. Ses écailles brillent et elle peut devenir invisible !" },
  { lv:1, sc:"ice", ic:"shield", q:"Qui est la maman de Harold, qu'il retrouve dans Dragons 2 ?", o:["Astrid","Valka","Kognedur","Gueulfor"], a:1,
    f:"Un dragon l'a emmenée quand Harold était bébé. Depuis, elle vivait en secret avec les dragons." },
  { lv:1, sc:"sea", ic:"eel", q:"De quoi les dragons ont-ils peur dans le premier film ?", o:["Des moutons","Des anguilles","Des poules","De la neige"], a:1,
    f:"Harold s'en sert pour faire reculer un Hideux Braguettaure pendant l'entraînement." },
  { lv:1, sc:"nest", ic:"flame", q:"De quelle espèce est Krochefer, le dragon de Rustik ?", o:["Un Gronk","Un Dragon Vipère","Un Cauchemar Monstrueux","Un Furie Nocturne"], a:2,
    f:"Le Cauchemar Monstrueux peut s'enflammer tout entier !" },
  { lv:1, sc:"nest", ic:"skull", q:"Comment s'appelle le dragon géant caché dans le Nid, à la fin du premier film ?", o:["La Mort Rouge","Le Grand Gronk","La Furie Éclair","Le Roi des Mers"], a:0,
    f:"Les autres dragons volaient la nourriture des Vikings pour la lui apporter… sinon, elle les mangeait !" },
  { lv:1, sc:"berk", ic:"tail", q:"Que perd Harold pendant la grande bataille du premier film ?", o:["Son casque","Une jambe","Sa voix","Son couteau"], a:1,
    f:"Comme Krokmou, il a maintenant une prothèse : ils se ressemblent encore plus !" },
  { lv:1, sc:"storm", ic:"skull", q:"Comment s'appelle le méchant de Dragons 2 ?", o:["Grimmel le Grave","Drago Poing-Sanglant","Alvin le Traître","Eret, fils d'Eret"], a:1,

  { lv:1, sc:"hidden", ic:"mushroom", q:"À la fin de Dragons 3, où partent vivre les dragons ?", o:["Au Nid des dragons","Dans le Monde caché","Sur la Lune","À Beurk"], a:1,

  { lv:1, sc:"berk", ic:"helmet", q:"Qui devient le chef de Beurk à la fin de Dragons 2 ?", o:["Astrid","Harold","Gueulfor","Valka"], a:1,
    f:"Tous les Vikings et tous les dragons s'inclinent devant lui." },
  { lv:1, sc:"sky", ic:"spikes", q:"De quelle espèce est Tempête, la dragonne d'Astrid ?", o:["Un Dragon Vipère","Un Gronk","Un Cauchemar Monstrueux","Un Furie Éclair"], a:0,
    f:"Elle peut lancer les épines de sa queue comme des flèches !" },
  { lv:1, sc:"cove", ic:"hand", q:"Comment Harold calme-t-il un Dragon Vipère pendant l'entraînement ?", o:["Il lui chante une chanson","Il le gratte sous le menton","Il lui donne un poisson","Il lui fait peur"], a:1,
    f:"Le dragon tombe par terre, tout content. Tous les Vikings sont bouche bée !" },
  { lv:1, sc:"night", ic:"flame", q:"Que crache Krokmou ?", o:["De la glace","De l'eau","Des boules de plasma","De l'acide"], a:2,
    f:"Ses tirs sont très précis : le Furie Nocturne ne rate jamais sa cible !" },
  { lv:1, sc:"hidden", ic:"heart", q:"Que se passe-t-il entre Harold et Astrid dans Dragons 3 ?", o:["Ils se disputent pour toujours","Ils se marient","Astrid part vivre ailleurs","Ils deviennent des dragons"], a:1,
    f:"À la fin du film, ils ont même des enfants !" },

  /* ---- épreuve 3 : Envol dans le ciel ---- */
  { lv:2, sc:"night", ic:"sun", q:"Comment Harold attrape-t-il un Terreur Terrible pendant l'entraînement ?", o:["Avec un filet","Avec le reflet d'un miroir","Avec un poisson","En sifflant"], a:1,
    f:"Le petit dragon court après la tache de lumière, comme un chat… et finit dans une cage !" },
  { lv:2, sc:"cove", ic:"tail", q:"Quel côté de la queue Krokmou a-t-il perdu ?", o:["Le côté gauche","Le côté droit","Les deux","Aucun"], a:0,
    f:"C'est pour ça qu'il ne peut pas voler seul : il a besoin de Harold sur son dos." },

    ship(W * 0.6 + Math.sin(t * 0.3) * 20 * U, H * 0.64 + Math.sin(t) * 3 * U, 40 * U, "#2a2018", "#b94a3a");
  },
  sky(t) {
    sky([[0, "#3b6fb0"], [0.5, "#f3a86a"], [1, "#f6d9b0"]]);
    glow(W * 0.75, H * 0.62, 260 * U, "255,200,140", 0.8);
    clouds(t, 5, "rgba(255,235,220,.7)", 0.1, 0.4, 8, 5, 0.9);
    flyers(t, 6, "rgba(40,30,50,.8)", 21, 0.15, 0.55, 46);
    clouds(t * 0.7, 10, "rgba(255,240,230,.95)", 0.84, 1.0, 6, 30, 1.7);
  },
  night(t) {
    sky([[0, "#070b1a"], [0.7, "#1b2a4a"], [1, "#0d1522"]]);
    motes(t, 80, "255,255,255", { size: 0.6, tw: 1.6, a: .9, seed: 40 });
    aurora(t);
    glow(W * 0.82, H * 0.16, 90 * U, "240,240,220", 0.5);
    cx.fillStyle = "#f2f0e0"; cx.beginPath(); cx.arc(W * 0.82, H * 0.16, 20 * U, 0, 6.283); cx.fill();
    flyers(t, 2, "rgba(5,8,15,.95)", 33, 0.25, 0.45, 60);
    sea(0.78, "#0e1c2c", t, "rgba(150,200,255,.25)");
    houses(0.05, 0.4, 0.8, "#070b12", true, t);
  },
  nest(t) {
    sky([[0, "#1f1616"], [0.5, "#6a3a2a"], [1, "#2a1a14"]]);
    for (let k = 0; k < 4; k++) glow(W * (0.2 + k * 0.2), H * (0.3 + 0.1 * Math.sin(t * 0.3 + k)), 200 * U, "150,140,140", 0.18);
    cx.fillStyle = "#1a1210"; cx.beginPath(); cx.moveTo(W * 0.08, H); cx.lineTo(W * 0.4, H * 0.3); cx.lineTo(W * 0.6, H * 0.28); cx.lineTo(W * 0.95, H); cx.fill();
    glow(W * 0.5, H * 0.3, 150 * U, "255,110,40", 0.6 + 0.2 * Math.sin(t * 2));
    for (let i = 0; i < 7; i++) { const a = t * 0.5 + i * 0.9, x = W * 0.5 + Math.cos(a) * W * 0.3, y = H * 0.24 + Math.sin(a) * H * 0.08; cx.save(); cx.translate(x, y); if (Math.sin(a) < 0) cx.scale(-1, 1); flyer(0, 0, 26 * U, Math.sin(t * 6 + i), "rgba(20,12,10,.9)"); cx.restore(); }
    motes(t, 40, "255,160,70", { vy: -1.4, vx: 0.2, size: 1.1, halo: true, seed: 60 });
  },
  ice(t) {
    sky([[0, "#9fc8dc"], [0.6, "#e8f4f8"], [1, "#cfe6ee"]]);
    clouds(t, 5, "rgba(255,255,255,.8)", 0.05, 0.3, 6, 8);
    cx.fillStyle = "#b8dcea";
    for (let i = 0; i < 9; i++) { const x = W * (i / 8), h = H * (0.25 + rnd(i) * 0.35), w = (40 + rnd(i * 2) * 50) * U; cx.beginPath(); cx.moveTo(x - w, H * 0.85); cx.lineTo(x + (rnd(i * 3) - .5) * 20 * U, H * 0.85 - h); cx.lineTo(x + w, H * 0.85); cx.fill(); }
    cx.fillStyle = "rgba(255,255,255,.6)";
    for (let i = 0; i < 9; i++) { const x = W * (i / 8), h = H * (0.25 + rnd(i) * 0.35); cx.beginPath(); cx.moveTo(x + (rnd(i * 3) - .5) * 20 * U, H * 0.85 - h); cx.lineTo(x + 12 * U, H * 0.85 - h * 0.5); cx.lineTo(x + 4 * U, H * 0.85 - h * 0.45); cx.fill(); }
    cx.fillStyle = "#eaf6fa"; cx.fillRect(0, H * 0.85, W, H);
    flyers(t, 3, "rgba(40,60,80,.6)", 70, 0.1, 0.3, 36);
    motes(t, 60, "255,255,255", { vy: 0.9, vx: 0.3, size: 1.1, seed: 80 });
  },
  hidden(t) {
    sky([[0, "#05060d"], [0.6, "#0d1428"], [1, "#050810"]]);
    const g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "rgba(120,200,255,.25)"); g.addColorStop(1, "rgba(120,200,255,0)");
    cx.fillStyle = g; cx.fillRect(W * 0.45, 0, W * 0.1, H);
    [[0.08, 0.8, "90,220,255"], [0.2, 0.68, "150,110,255"], [0.33, 0.86, "110,255,170"], [0.68, 0.84, "90,220,255"], [0.8, 0.7, "150,110,255"], [0.92, 0.82, "110,255,170"], [0.55, 0.9, "255,120,200"]].forEach(([x, y, rgb], i) => {
      const p = 0.5 + 0.3 * Math.sin(t * 1.3 + i * 1.7), r = (18 + rnd(i) * 22) * U;
      glow(W * x, H * y, r * 5, rgb, p * 0.6);
      cx.fillStyle = `rgba(${rgb},.9)`; cx.beginPath(); cx.ellipse(W * x, H * y, r, r * 0.5, 0, 3.1416, 6.283); cx.fill();
      cx.fillStyle = "rgba(230,240,255,.7)"; cx.fillRect(W * x - r * 0.12, H * y, r * 0.24, r * 0.9);
    });
    cx.fillStyle = "#03040a"; cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(W * 0.3, 0); cx.lineTo(W * 0.12, H * 0.2); cx.lineTo(0, H * 0.35); cx.fill();
    cx.beginPath(); cx.moveTo(W, 0); cx.lineTo(W * 0.72, 0); cx.lineTo(W * 0.9, H * 0.22); cx.lineTo(W, H * 0.3); cx.fill();
    cx.fillStyle = "#03040a"; cx.fillRect(0, H * 0.94, W, H);
    for (let i = 0; i < 4; i++) { const a = t * 0.35 + i * 1.6, x = W * 0.5 + Math.cos(a) * W * 0.28, y = H * 0.4 + Math.sin(a * 1.3) * H * 0.12; cx.save(); cx.translate(x, y); if (Math.sin(a) < 0) cx.scale(-1, 1); glow(0, 0, 50 * U, "120,220,255", 0.25); flyer(0, 0, 30 * U, Math.sin(t * 5 + i), "rgba(10,14,24,.95)"); cx.restore(); }
    motes(t, 50, "140,230,255", { vy: -0.4, size: 1, halo: true, seed: 100 });
  },
  storm(t) {
    sky([[0, "#1c2128"], [0.6, "#3a4450"], [1, "#1a2028"]]);
    clouds(t, 8, "rgba(30,36,44,.9)", 0.02, 0.3, 14, 2, 1.3);
    const flash = (t * 0.35) % 1;
    if (flash < 0.05) {
      cx.fillStyle = "rgba(230,240,255,.25)"; cx.fillRect(0, 0, W, H);
      cx.strokeStyle = "rgba(240,248,255,.9)"; cx.lineWidth = 3 * U; cx.beginPath();
      let x = W * (0.2 + rnd(Math.floor(t * 0.35)) * 0.6), y = 0; cx.moveTo(x, y);
      for (let k = 0; k < 7; k++) { x += (rnd(k + Math.floor(t)) - .5) * 60 * U; y += H * 0.08; cx.lineTo(x, y); } cx.stroke();
    }
    sea(0.7, "#1f2d38", t, "rgba(200,220,240,.3)");
    [[0.2, 0.71, 36], [0.45, 0.73, 28], [0.75, 0.7, 44]].forEach(([x, y, s], i) => ship(W * x + Math.sin(t * 0.4 + i) * 10 * U, H * y + Math.sin(t + i) * 3 * U, s * U, "#0e1216", "#3a2a24"));
    cx.strokeStyle = "rgba(200,215,230,.25)"; cx.lineWidth = 1.5 * U;
    for (let k = 0; k < 60; k++) { const x = (rnd(k) * W + t * 60 * U) % W, y = (rnd(k * 3) * H + t * 400 * U) % H; cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x - 6 * U, y + 18 * U); cx.stroke(); }
  }
};

function draw(now) {
  const t = reduce ? 0 : now / 1000;
  if (prev && now - fadeAt < 900) { SCENES[prev](t); cx.globalAlpha = (now - fadeAt) / 900; SCENES[scene](t); cx.globalAlpha = 1; }
  else { prev = null; SCENES[scene](t); }
  const b = (now - burstAt) / 1000;
  if (b < 2.5 && !reduce) {
    for (let i = 0; i < 80; i++) {
      const a = rnd(i) * 6.283, sp = (150 + rnd(i * 2) * 350) * U, x = W / 2 + Math.cos(a) * sp * b, y = H * 0.45 + Math.sin(a) * sp * b + 120 * U * b * b;
      cx.fillStyle = `rgba(${["232,185,60", "156,204,79", "79,211,232"][i % 3]},${1 - b / 2.5})`;
      cx.beginPath(); cx.arc(x, y, (2 + rnd(i * 3) * 3) * U, 0, 6.283); cx.fill();
    }
  }
  if (!reduce || prev || b < 2.5) requestAnimationFrame(draw); else idle = true;
}
let idle = false;
function setScene(s) {
  if (s === scene) return;
  prev = scene; scene = s; fadeAt = performance.now();
  if (idle) { idle = false; requestAnimationFrame(draw); }
}
function burst() { burstAt = performance.now(); if (idle) { idle = false; requestAnimationFrame(draw); } }
resize(); addEventListener("resize", () => { resize(); if (idle) requestAnimationFrame(draw); });
requestAnimationFrame(draw);

/* ================= APP ================= */
const bar = document.getElementById("bar"), stage = document.getElementById("stage");
let st = null, wake = null;

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
const canFS = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);

function tools() {
  return `<div class="tools">
    <button class="tool${Sound.musicOn ? "" : " off"}" id="snd" aria-label="Musique" title="Musique">🎵</button>
    <button class="tool${Sound.fxOn ? "" : " off"}" id="sfx" aria-label="Bruitages" title="Bruitages">🔔</button>
    ${canFS ? `<button class="tool" id="fs" aria-label="Plein écran">⛶</button>` : ""}
  </div>`;
}
function wireTools() {
  const s = document.getElementById("snd");
  s.onclick = () => { Sound.init(); s.classList.toggle("off", !Sound.toggleMusic()); };
  const x = document.getElementById("sfx");
  x.onclick = () => { Sound.init(); x.classList.toggle("off", !Sound.toggleFx()); Sound.fx("tap"); };
  const f = document.getElementById("fs");
  if (f) f.onclick = () => {
    const d = document, el = d.documentElement;
    try {
      if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      else { const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (p && p.catch) p.catch(() => {}); }
    } catch (e) {}
  };
}
function setBar(inner) { bar.innerHTML = inner + tools(); wireTools(); }
function hud() {
  const q = st.qs[st.i];
  const seeds = st.qs.map((_, k) => { const r = st.results[k]; return `<div class="seed ${r === true ? "ok" : r === false ? "ko" : k === st.i ? "now" : ""}"></div>`; }).join("");
  return `<div class="hud"><div class="hud-top"><span class="lv">${LEVELS[q.lv].emoji} ${LEVELS[q.lv].name}</span><span class="sc">🐟 ${st.score}</span></div>
    <div class="seeds" style="grid-template-columns: repeat(${st.qs.length}, 1fr)" aria-label="Question ${st.i + 1} sur ${st.qs.length}">${seeds}</div></div>`;
}
function keepAwake() {
  try { if (navigator.wakeLock && !wake) navigator.wakeLock.request("screen").then(l => { wake = l; l.addEventListener("release", () => wake = null); }).catch(() => {}); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && st) keepAwake(); });

function start() {
  setScene("berk"); Sound.play("A");
  setBar(`<div class="brand">Dragons</div>`);
  const name = store("beurk-name") || "Mélina";
  const quickN = LEVELS.reduce((s, l) => s + l.quick, 0);
  const bq = store("beurk-best-quick"), bg = store("beurk-best-grand");
  stage.innerHTML = `
    <section class="card start pop">
      <div class="hero">
        <div class="kicker">Dragons · Dragons 2 · Dragons 3 : Le monde caché</div>
        <div class="title">Le Grand Quiz de Beurk</div>
        <p>${Q.length} questions en quatre épreuves de plus en plus difficiles. Chaque bonne réponse rapporte un poisson pour Krokmou&nbsp;!</p>
        ${bq || bg ? `<p class="hint">🏆 Records : ${bq ? `partie rapide <b>${esc(bq)}/${quickN}</b>` : ""}${bq && bg ? " · " : ""}${bg ? `grande aventure <b>${esc(bg)}/${Q.length}</b>` : ""}</p>` : ""}
        <div class="levels">${LEVELS.map(l => `<div class="lvl"><div class="badge">${l.emoji}</div><div><b>${l.name}</b><span>${l.desc}</span></div></div>`).join("")}</div>
      </div>
      <div class="side">
        <label class="name" for="player">Ton prénom
          <input id="player" type="text" maxlength="20" autocomplete="off" value="${esc(name)}">
        </label>
        <button class="btn" id="quick">Partie rapide · ${quickN} questions</button>
        <button class="btn" id="grand">Grande aventure · ${Q.length} questions</button>
        <p class="hint">Les questions de la partie rapide sont tirées au hasard : chaque partie est différente !</p>
        <p class="hint">🎵 coupe la musique du quiz, 🔔 coupe les bruitages.</p>
        <p class="hint">📺 Pour la télé : tourne le téléphone en mode paysage avant de lancer la diffusion.</p>
      </div>
    </section>`;
  const begin = mode => {
    Sound.init(); Sound.fx("tap"); keepAwake();
    const n = document.getElementById("player").value.trim() || "Mélina";
    store("beurk-name", n);
    let seen = [];
    try { seen = JSON.parse(store("beurk-seen") || "[]"); } catch (e) { seen = []; }
    if (!Array.isArray(seen)) seen = [];
    const picked = [];
    LEVELS.forEach((l, lv) => {
      const qs = shuffle(Q.map((_, k) => k).filter(k => Q[k].lv === lv));
      if (mode !== "quick") { picked.push(...qs); return; }
      let fresh = qs.filter(k => !seen.includes(k));
      if (fresh.length < l.quick) {
        seen = seen.filter(k => !Q[k] || Q[k].lv !== lv);
        fresh = fresh.concat(qs.filter(k => !fresh.includes(k)));
      }
      const take = fresh.slice(0, l.quick);
      seen.push(...take); picked.push(...take);
    });
    if (mode === "quick") store("beurk-seen", JSON.stringify(seen));
    const pool = picked.map(k => Q[k]);
    st = { name: n, mode, i: 0, score: 0, results: [],
      qs: pool.map(q => { const order = shuffle(q.o.map((_, k) => k)); return { ...q, opts: order.map(k => q.o[k]), right: order.indexOf(q.a) }; }) };
    interlude(0);
  };
  document.getElementById("quick").onclick = () => begin("quick");
  document.getElementById("grand").onclick = () => begin("grand");
}

function interlude(lv) {
  const l = LEVELS[lv];
  setScene(l.scene); Sound.play(l.song); Sound.fx("level");
  const n = st.qs.filter(q => q.lv === lv).length;
  setBar(`<div class="brand">Épreuve ${lv + 1} sur ${LEVELS.length}</div>`);
  stage.innerHTML = `
    <section class="card center pop">
      ${medal(l.icon)}
      <div class="kicker">${lv === 0 ? `C'est parti, ${esc(st.name)} !` : lv === 3 ? "Attention, ça devient très dur !" : "Épreuve réussie !"}</div>
      <h2>Épreuve ${lv + 1} : ${l.name}</h2>
      <p>${n} questions · ${l.desc}</p>
      <button class="btn" id="go">J'y vais !</button>
    </section>`;
  const g = document.getElementById("go"); g.onclick = () => { Sound.fx("tap"); ask(); }; g.focus({ preventScroll: true });
}

function ask() {
  const q = st.qs[st.i];
  setScene(q.sc);
  setBar(hud());
  stage.innerHTML = `
    <section class="card qcard pop" id="qc">
      <div class="qhead">
        ${medal(q.ic)}
        <div>
          <div class="qnum">Question ${st.i + 1} / ${st.qs.length}</div>
          <div class="qtext">${esc(q.q)}</div>
        </div>
      </div>
      <div class="answers">
        ${q.opts.map((o, k) => `<button class="ans" data-k="${k}"><span class="l">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}
      </div>
      <div class="fb" id="fb"></div>
    </section>`;
  stage.scrollTop = 0;
  stage.querySelectorAll(".ans").forEach(b => b.onclick = () => answer(+b.dataset.k));
}

function answer(k) {
  const q = st.qs[st.i], ok = k === q.right;
  st.results[st.i] = ok; if (ok) st.score++;
  Sound.fx(ok ? "good" : "bad");
  document.getElementById("qc").classList.add("answered");
  stage.querySelectorAll(".ans").forEach((b, j) => {
    b.disabled = true;
    if (j === q.right) b.classList.add("right"); else if (j === k) b.classList.add("wrong"); else b.classList.add("dim");
  });
  setBar(hud());
  const last = st.i === st.qs.length - 1, fb = document.getElementById("fb");
  fb.innerHTML = `<div class="feedback pop ${ok ? "ok" : "ko"}">
    ${BUDDY}
    <div class="say">${ok ? pick(CHEERS) : pick(OOPS) + " C'était : " + esc(q.opts[q.right])}</div>
    <div class="fact">💡 ${q.f}</div>
    <button class="btn" id="next">${last ? "Voir mon score" : "Question suivante"}</button>
  </div>`;
  fb.querySelector(".buddy").classList.add(ok ? "hop" : "sad");
  const next = document.getElementById("next");
  next.onclick = () => {
    Sound.fx("tap"); st.i++;
    if (st.i >= st.qs.length) return finish();
    if (st.qs[st.i].lv !== st.qs[st.i - 1].lv) return interlude(st.qs[st.i].lv);
    ask();
  };
  next.focus({ preventScroll: true });
  fb.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
}

function finish() {
  const N = st.qs.length, rank = RANKS.find(r => st.score / N >= r.min);
  const key = "beurk-best-" + st.mode;
  const prevBest = parseInt(store(key) || "0", 10), record = st.score > prevBest;
  if (record) store(key, String(st.score));
  const per = LEVELS.map((l, lv) => { const idx = st.qs.map((q, k) => q.lv === lv ? k : -1).filter(k => k >= 0); return { l, got: idx.filter(k => st.results[k]).length, of: idx.length }; });
  const missed = st.qs.filter((q, k) => !st.results[k]);
  setScene(st.score / N >= .68 ? "hidden" : "sky"); Sound.play("A"); Sound.fx("win"); burst();
  setBar(`<div class="brand">Fin de l'aventure</div>`);
  stage.innerHTML = `
    <section class="card result pop">
      <div class="res-main">
        ${medal(rank.icon)}
        <div class="kicker">${esc(st.name)}, tu es…</div>
        <div class="rank">${rank.name}</div>
        <div class="score">${st.score}<small> / ${N}</small></div>
        <p>${rank.msg}${record && prevBest > 0 ? " <b>Nouveau record !</b>" : ""}</p>
      </div>
      <div class="res-side">
        <div class="breakdown">${per.map(p => `<div><span class="e">${p.l.emoji}</span><span class="n">${p.got}/${p.of}</span><span class="t">${p.l.name}</span></div>`).join("")}</div>
        ${missed.length ? `<div class="missed"><h3>Les réponses à retenir</h3><ul>${missed.map(q => `<li>${esc(q.q)}<br>→ <b>${esc(q.o[q.a])}</b></li>`).join("")}</ul></div>` : `<p>Un sans-faute ! 🎉</p>`}
        <button class="btn" id="again">Rejouer</button>
      </div>
    </section>`;
  stage.scrollTop = 0;
  document.getElementById("again").onclick = () => { Sound.fx("tap"); start(); };
}

start();
</script>
</body>
</html>
