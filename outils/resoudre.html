<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Résolution des nouveautés</title></head>
<body style="font:14px/1.5 monospace;background:#111;color:#ddd;padding:20px">
<p id="etat">…</p>
<script src="../js/config.js?r=1"></script>
<script src="../js/match.js?r=1"></script>
<script src="../js/playlists.js?r=1"></script>
<script src="../js/itunes.js?r=1"></script>
<script>
/* Page jetable : fait résoudre les candidats par le moteur du jeu lui-même,
   pour qu'Audrey entende exactement ce que le jeu jouerait. */
/* Les réglages d'une catégorie — intitulés des cases, réponse unique,
   titre exact exigé — se lisent dans la playlist, là où le jeu les lit
   lui-même. Une table recopiée ici ne valait que pour les trois catégories
   du premier paquet, et la quatrième plantait la page. */
function reglagesDe(cat) {
  var m = Playlists.parId(cat);
  if (!m) throw new Error('catégorie inconnue de la playlist : ' + cat);
  return {
    nom: m.nom,
    labelT: m.labelT || 'Titre',
    labelA: m.labelA || 'Artiste',
    solo: m.solo || null,
    strict: !!m.strict,
    langue: m.langue || 'fr'
  };
}

window.__fait = [];
window.__rate = [];
window.__fini = false;

(async function () {
  var data = await fetch('../nouveautes.json?r=1').then(function (r) { return r.json(); });
  var total = 0;
  Object.keys(data).forEach(function (k) { total += data[k].length; });
  var n = 0;

  for (var cat of Object.keys(data)) {
    var m = reglagesDe(cat);
    for (var p of data[cat]) {
      n++;
      document.getElementById('etat').textContent = n + ' / ' + total + '  —  ' + p.t;
      var piste = Object.assign({}, p, {
        labelA: m.labelA, labelT: m.labelT, solo: m.solo,
        strict: m.strict, langue: m.langue, categorie: m.nom
      });
      try {
        var r = await Itunes.resoudre(piste);
        if (r && r.apercu) {
          window.__fait.push({
            cat: cat, t: p.t, a: p.a,
            aa: r.artiste, alb: r.album || '', img: r.pochette || '', apercu: r.apercu,
            sol: m.solo || '', lab: m.labelA
          });
        } else {
          window.__rate.push({ cat: cat, t: p.t, a: p.a, pourquoi: 'aucun extrait' });
        }
      } catch (e) {
        window.__rate.push({ cat: cat, t: p.t, a: p.a, pourquoi: String(e).slice(0, 60) });
      }
      await new Promise(function (ok) { setTimeout(ok, 2600); });
    }
  }
  window.__fini = true;
  document.getElementById('etat').textContent =
    'terminé : ' + window.__fait.length + ' résolus, ' + window.__rate.length + ' ratés';
})();
</script>
</body>
</html>
